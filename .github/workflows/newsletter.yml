name: The Stack Sheet newsletter

on:
  schedule:
    # Every day 07:47 UTC (08:47 Paris). Sends only when an issue in Notion is Ready and due,
    # and finishes any leftover recipients from the day before.
    - cron: "47 7 * * *"
    # Every hour at :17: welcome email to anyone who subscribed since the last run.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        options: [list, test, welcome, send, setup]
        default: list
      issue:
        description: "For test: issue number, or welcome (empty = next Ready issue)"
        required: false
        default: ""

concurrency: newsletter

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        run: python3 newsletter.py ${{ inputs.command || (github.event.schedule == '17 * * * *' && 'welcome' || 'send') }} ${{ inputs.issue }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.UFT_SENDER }}
          NOTION_SUBSCRIBERS_DB: ${{ vars.NOTION_SUBSCRIBERS_DB }}
          NOTION_ISSUES_DB: ${{ vars.NOTION_ISSUES_DB }}
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL || 'hello@usefulfoundertools.me' }}
          FROM_NAME: The Stack Sheet
          REPLY_TO: info@usefulfoundertools.me
          TEST_TO: ${{ vars.TEST_TO }}
          DRY_RUN: ${{ vars.NEWSLETTER_DRY_RUN || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
